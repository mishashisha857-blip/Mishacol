name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          if [ -d "Mishacol-main" ] && [ -f "Mishacol-main/settings.gradle.kts" ]; then
            cd Mishacol-main
          fi

          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Настройки стабильности для KSP и Gradle
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.incremental.intermodule=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
